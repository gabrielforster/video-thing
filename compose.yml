services:
  localstack:
    image: localstack/localstack:4
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs
      - DEFAULT_REGION=us-east-1
    volumes:
      - ./docker/localstack-init:/etc/localstack/init/ready.d

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=videothing
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=userpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
