services:
  localstack:
    image: localstack/localstack:4
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs
      - DEFAULT_REGION=us-east-1
    volumes:
      - ./docker/localstack-init:/etc/localstack/init/ready.d

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=videothing
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=userpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

networks:
  # Pinned because the host's default Docker bridge pool (172.17-172.31/16)
  # is fully consumed by ~30 unrelated pre-existing project networks, so
  # `docker compose up` fails with address-pool exhaustion. 10.89.0.0/24 was
  # verified free on this host at the time this was added.
  default:
    ipam:
      config:
        - subnet: 10.89.0.0/24
